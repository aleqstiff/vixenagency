# Redirect www a NO-www (canonical sin www)
[[redirects]]
  from = "https://www.onlysweety.com/*"
  to = "https://onlysweety.com/:splat"
  status = 301
  force = true

# NO redirect on root "/" — serve public/index.html which has Trustpilot meta + JS redirect to /es/
# This lets verification bots (Trustpilot, Google) read the meta tag at the root.

# SPA fallback for other paths — solo GET/HEAD, no POST (no rompe el formulario)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  conditions = {Method = ["GET", "HEAD"]}

# ── Security & cache headers ──

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/*.xsl"
  [headers.values]
    Content-Type = "text/xsl; charset=utf-8"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
